[package]
name = "vibedeck"
version = "0.1.0"
description = "A fast desktop music client with unified local and YouTube libraries"
authors = ["VibeDeck"]
edition = "2021"

[lib]
name = "vibedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
webview2-com = "0.38.2"
windows-core = "0.61.2"
cpal = "0.15"
symphonia = { version = "0.5", features = ["aac", "isomp4", "ogg", "vorbis", "mkv", "wav"] }
rustfft = "6"
tokio = { version = "1", features = ["time"] }
vibedeck-bootstrap-inspect = { path = "../tools/bootstrap-inspect", optional = true }
vibedeck-decipher-eval = { path = "../tools/decipher-eval", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_System_Com"] }

[features]
native-range-playback = ["bootstrap-inspection", "dep:vibedeck-decipher-eval"]
native-playback-trial = ["native-range-playback"]
bootstrap-inspection = ["dep:vibedeck-bootstrap-inspect"]
custom-protocol = ["tauri/custom-protocol"]
