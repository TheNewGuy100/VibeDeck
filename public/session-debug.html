<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VibeDeck — debug de sessão</title>
<style>
body{font:16px system-ui;max-width:800px;margin:40px auto;padding:20px;background:#151515;color:#eee}
button{font:inherit;padding:12px;margin:6px}pre{white-space:pre-wrap}button:focus-visible{outline:3px solid #9cf}
</style>
<h1>Debug de sessão</h1>
<p>Somente Windows debug. Nenhuma ação é automática. Não carrega biblioteca nem inicia áudio.</p>
<p>A captura substitui o snapshot protegido. O login pode navegar autenticado. A restauração usa uma página privada em branco.</p>
<button data-action="open_login">1. Abrir login</button>
<button data-action="capture_save">2. Capturar e salvar</button>
<button data-action="verify_snapshot">3. Verificar snapshot local</button>
<button data-action="restore_verify">4. Restaurar e comparar</button>
<pre id="result" role="status" aria-live="polite">Aguardando ação explícita.</pre>
<script>
const output = document.querySelector('#result');
const buttons = [...document.querySelectorAll('button')];
for (const button of buttons) button.addEventListener('click', async () => {
  if (button.dataset.action === 'capture_save' && !confirm('Substituir o snapshot protegido pela sessão da janela de login?')) return;
  buttons.forEach(item => item.disabled = true);
  output.textContent = 'Executando uma operação; sem repetição automática…';
  try {
    const report = await window.__TAURI_INTERNALS__.invoke('debug_youtube_session', { action: button.dataset.action });
    output.textContent = JSON.stringify(report, null, 2);
  } catch (error) {
    const code = typeof error === 'string' && /^session_debug_[a-z_]+$/.test(error) ? error : 'session_debug_unavailable';
    output.textContent = code;
  } finally { buttons.forEach(item => item.disabled = false); }
});
</script>
</html>
